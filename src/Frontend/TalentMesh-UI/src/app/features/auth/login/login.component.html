<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <a routerLink="/" class="brand-icon">
        TM
      </a>

      <h1>Welcome back</h1>

      <p>
        Sign in to your TalentMesh account
      </p>

    </div>


    <form
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required=""
        />

        <!-- @if (
          loginForm.controls.email.touched &&
          loginForm.controls.email.invalid
        ) {
          <small>
            Please enter a valid email address.
          </small>
        } -->

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />

        <!-- @if (
          loginForm.controls.password.touched &&
          loginForm.controls.password.invalid
        ) {
          <small>
            Password is required.
          </small>
        } -->

      </div>


      @if (errorMessage) {
        <div class="error-message" role="alert">
          {{ errorMessage }}
        </div>
      }


      <button
        type="submit"
        class="submit-button"
        [disabled]="isLoading"
      >

        @if (isLoading) {
          Signing in...
        } @else {
          Sign In
        }

      </button>

    </form>


    <p class="auth-footer">

      Don't have an account?

      <a routerLink="/signup">
        Create an account
      </a>

    </p>


    <a
      routerLink="/"
      class="back-link"
    >
      ← Back to Home
    </a>

  </div>

</div>
